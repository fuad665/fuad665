<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" width="100%" height="280">
  <defs>
    <!-- Background Gradient (Rich Deep Slate to Cyber Dark) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="50%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="cyberCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    
    <linearGradient id="cyberGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <radialGradient id="cyanGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="greenGlow" cx="20%" cy="20%" r="40%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>

    <!-- Technical Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-opacity="0.3" stroke-width="0.8" />
      <path d="M 20 0 L 20 40 M 0 20 L 40 20" fill="none" stroke="#1e293b" stroke-opacity="0.1" stroke-width="0.5" stroke-dasharray="2 2" />
    </pattern>

    <!-- Typing Mask for "Fuad Hiybo Hussin" (17 chars, ~19px each, width: 323px, starts at x="238") -->
    <clipPath id="typingNameClip">
      <rect x="238" y="90" height="50" width="0">
        <animate 
          attributeName="width" 
          values="0;19;38;57;76;95;114;133;152;171;190;209;228;247;266;285;304;323" 
          dur="3s" 
          begin="0.5s" 
          fill="freeze" 
          calcMode="discrete"
        />
      </rect>
    </clipPath>
  </defs>

  <style>
    .font-tech {
      font-family: 'Consolas', 'Fira Code', 'Courier New', monospace;
    }
    
    .title-name {
      font-size: 34px;
      font-weight: 700;
      fill: #ffffff;
      letter-spacing: 0.5px;
    }

    .role-label {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 1px;
    }

    /* Subtitle cycling animation */
    .role-text {
      opacity: 0;
    }

    .role1 { animation: cycle1 12s infinite; fill: #38bdf8; }
    .role2 { animation: cycle2 12s infinite; fill: #34d399; }
    .role3 { animation: cycle3 12s infinite; fill: #a78bfa; }
    .role4 { animation: cycle4 12s infinite; fill: #fb7185; }

    @keyframes cycle1 {
      0%, 22% { opacity: 1; }
      23%, 100% { opacity: 0; }
    }
    @keyframes cycle2 {
      0%, 23% { opacity: 0; }
      25%, 47% { opacity: 1; }
      48%, 100% { opacity: 0; }
    }
    @keyframes cycle3 {
      0%, 48% { opacity: 0; }
      50%, 72% { opacity: 1; }
      73%, 100% { opacity: 0; }
    }
    @keyframes cycle4 {
      0%, 73% { opacity: 0; }
      75%, 97% { opacity: 1; }
      98%, 100% { opacity: 0; }
    }

    /* Micro blinking animations */
    .blink {
      animation: blink-anim 0.8s infinite;
    }
    @keyframes blink-anim {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    .pulse {
      animation: pulse-anim 3s infinite ease-in-out;
    }
    @keyframes pulse-anim {
      0%, 100% { opacity: 0.2; }
      50% { opacity: 0.6; }
    }
  </style>

  <!-- 1. Background Fill and Glows -->
  <rect width="800" height="280" fill="url(#bgGrad)" />
  <rect width="800" height="280" fill="url(#cyanGlow)" />
  <rect width="800" height="280" fill="url(#greenGlow)" />

  <!-- 2. Grid Pattern Overlay -->
  <rect width="800" height="280" fill="url(#grid)" />

  <!-- 3. Tech Design Elements / Corner Brackets -->
  <!-- Outer glowing border line -->
  <rect x="15" y="15" width="770" height="250" fill="none" stroke="#1e293b" stroke-width="1.5" />
  
  <!-- Outer Corner Brackets (Tech Accents) -->
  <path d="M 25 15 L 15 15 L 15 25" fill="none" stroke="#06b6d4" stroke-width="3" stroke-linecap="round" />
  <path d="M 775 15 L 785 15 L 785 25" fill="none" stroke="#06b6d4" stroke-width="3" stroke-linecap="round" />
  <path d="M 25 265 L 15 265 L 15 255" fill="none" stroke="#06b6d4" stroke-width="3" stroke-linecap="round" />
  <path d="M 775 265 L 785 265 L 785 255" fill="none" stroke="#06b6d4" stroke-width="3" stroke-linecap="round" />

  <!-- Technical HUD Graphics -->
  <g stroke="#334155" stroke-width="1" stroke-opacity="0.5" fill="none" class="pulse">
    <!-- Centered Target Reticle -->
    <circle cx="400" cy="115" r="95" stroke-dasharray="4 8" />
    <circle cx="400" cy="115" r="105" stroke-dasharray="30 20" />
    <circle cx="400" cy="115" r="4" fill="#06b6d4" fill-opacity="0.3" stroke="none" />
    <!-- Technical Axis ticks -->
    <line x1="400" y1="5" x2="400" y2="15" stroke="#06b6d4" stroke-opacity="0.7" stroke-width="2" />
    <line x1="400" y1="265" x2="400" y2="275" stroke="#06b6d4" stroke-opacity="0.7" stroke-width="2" />
    <line x1="15" y1="140" x2="25" y2="140" stroke="#06b6d4" stroke-opacity="0.4" />
    <line x1="775" y1="140" x2="785" y2="140" stroke="#06b6d4" stroke-opacity="0.4" />
  </g>

  <!-- Status Tags and System Indicators -->
  <g font-size="9" font-weight="bold" fill="#64748b" class="font-tech">
    <!-- Top Left -->
    <text x="30" y="32">SYSTEM: ACTIVE</text>
    <rect x="125" y="24" width="6" height="6" fill="#10b981" class="blink" />
    
    <!-- Top Right -->
    <text x="690" y="32" text-anchor="end">AI_MODEL_INIT // OK</text>
    <circle cx="705" cy="29" r="3" fill="#06b6d4" />
    
    <!-- Bottom Left -->
    <text x="30" y="252">LOC: 03_08_MY // UTC+8</text>
    
    <!-- Bottom Right -->
    <text x="770" y="252" text-anchor="end">v2.5.0-STABLE</text>
  </g>

  <!-- 4. Text Display Console (Centered) -->
  <g class="font-tech">
    <!-- Tech Scanner Box around name -->
    <rect x="220" y="85" width="360" height="60" rx="6" fill="#0f172a" fill-opacity="0.8" stroke="url(#cyberGreen)" stroke-width="1.5" />
    <path d="M 230 85 L 220 85 L 220 95" fill="none" stroke="#10b981" stroke-width="3" />
    <path d="M 570 85 L 580 85 L 580 95" fill="none" stroke="#10b981" stroke-width="3" />
    <path d="M 230 145 L 220 145 L 220 135" fill="none" stroke="#10b981" stroke-width="3" />
    <path d="M 570 145 L 580 145 L 580 135" fill="none" stroke="#10b981" stroke-width="3" />

    <!-- Prompt character indicator -->
    <text x="242" y="126" font-size="28" font-weight="bold" fill="#10b981">&gt;</text>

    <!-- Typing Name using Clip Path Mask -->
    <!-- Fuad Hiybo Hussin (starts at x="268") -->
    <text x="268" y="127" class="title-name" clip-path="url(#typingNameClip)">Fuad Hiybo Hussin</text>

    <!-- Typing Cursor (animates x step-by-step from 268 to 591, then blinks in place) -->
    <rect y="98" width="10" height="32" fill="#10b981">
      <animate 
        attributeName="x" 
        values="268;287;306;325;344;363;382;401;420;439;458;477;496;515;534;553;572;591" 
        dur="3s" 
        begin="0.5s" 
        fill="freeze" 
        calcMode="discrete"
      />
      <animate 
        attributeName="opacity" 
        values="1;0;1" 
        dur="0.8s" 
        repeatCount="indefinite" 
      />
    </rect>

    <!-- Console separator line -->
    <line x1="260" x2="540" y1="162" y2="162" stroke="#1e293b" stroke-width="1.5" />
    <circle cx="400" cy="162" r="3" fill="#06b6d4" />

    <!-- Subtitle Roles Section (Middle Centered) -->
    <g class="role-label" font-size="14" font-weight="700">
      <text class="role-text role1" x="400" y="190" text-anchor="middle">Full-Stack Software Developer</text>
      <text class="role-text role2" x="400" y="190" text-anchor="middle">Next.js &amp; React Architect</text>
      <text class="role-text role3" x="400" y="190" text-anchor="middle">Node.js &amp; PostgreSQL Engineer</text>
      <text class="role-text role4" x="400" y="190" text-anchor="middle">Supabase &amp; Row-Level Security Expert</text>
    </g>

    <!-- Blinking console cursor for subtitle -->
    <text x="400" y="212" class="blink" text-anchor="middle" font-size="16" fill="#64748b">█</text>
  </g>
</svg>
