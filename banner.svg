<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" width="100%" height="280">
  <defs>
    <!-- Background Gradient (Rich Deep Slate to Cyber Dark) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="50%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#02040a" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="cyberCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    
    <linearGradient id="cyberGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <radialGradient id="cyanGlow" cx="15%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="greenGlow" cx="70%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>

    <!-- Technical Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-opacity="0.25" stroke-width="0.8" />
      <path d="M 20 0 L 20 40 M 0 20 L 40 20" fill="none" stroke="#1e293b" stroke-opacity="0.08" stroke-width="0.5" stroke-dasharray="2 2" />
    </pattern>

    <!-- Typing Mask for Name "Fuad Hiybo Hussin" (17 chars, ~25px each, width: 425px, starts at x="60") -->
    <clipPath id="typingNameClip">
      <rect x="60" y="70" height="70" width="0">
        <animate 
          attributeName="width" 
          values="0;25;50;75;100;125;150;175;200;225;250;275;300;325;350;375;400;425" 
          dur="2.5s" 
          begin="0.5s" 
          fill="freeze" 
          calcMode="discrete"
        />
      </rect>
    </clipPath>

    <!-- Typing Masks for Roles (using smooth slide-reveal for proportional sans-serif font) -->
    <clipPath id="clipRole1">
      <rect x="58" y="160" height="40" width="0">
        <animate attributeName="width" values="0;360;360;0;0" keyTimes="0;0.05;0.22;0.25;1" dur="16s" repeatCount="indefinite" />
      </rect>
    </clipPath>
    <clipPath id="clipRole2">
      <rect x="58" y="160" height="40" width="0">
        <animate attributeName="width" values="0;0;360;360;0;0" keyTimes="0;0.25;0.30;0.47;0.50;1" dur="16s" repeatCount="indefinite" />
      </rect>
    </clipPath>
    <clipPath id="clipRole3">
      <rect x="58" y="160" height="40" width="0">
        <animate attributeName="width" values="0;0;360;360;0;0" keyTimes="0;0.50;0.55;0.72;0.75;1" dur="16s" repeatCount="indefinite" />
      </rect>
    </clipPath>
    <clipPath id="clipRole4">
      <rect x="58" y="160" height="40" width="0">
        <animate attributeName="width" values="0;0;360;360;0" keyTimes="0;0.75;0.80;0.97;1" dur="16s" repeatCount="indefinite" />
      </rect>
    </clipPath>
  </defs>

  <style>
    .font-tech {
      font-family: 'Consolas', 'Fira Code', 'Courier New', monospace;
    }
    
    .font-sans {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }
    
    .title-name {
      font-size: 44px;
      font-weight: 800;
      fill: #ffffff;
      letter-spacing: -0.5px;
      text-shadow: 0 0 20px rgba(6, 182, 212, 0.4);
    }

    .role-label {
      font-size: 19px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    /* Subtitle cycling animations for opacity sync */
    .role-text {
      opacity: 0;
    }

    .role1 { animation: opacityRole1 16s infinite; fill: #06b6d4; }
    .role2 { animation: opacityRole2 16s infinite; fill: #10b981; }
    .role3 { animation: opacityRole3 16s infinite; fill: #a855f7; }
    .role4 { animation: opacityRole4 16s infinite; fill: #fb7185; }

    @keyframes opacityRole1 {
      0%, 22% { opacity: 1; }
      23%, 100% { opacity: 0; }
    }
    @keyframes opacityRole2 {
      0%, 23% { opacity: 0; }
      25%, 47% { opacity: 1; }
      48%, 100% { opacity: 0; }
    }
    @keyframes opacityRole3 {
      0%, 48% { opacity: 0; }
      50%, 72% { opacity: 1; }
      73%, 100% { opacity: 0; }
    }
    @keyframes opacityRole4 {
      0%, 73% { opacity: 0; }
      75%, 97% { opacity: 1; }
      98%, 100% { opacity: 0; }
    }

    /* Micro blinking animations */
    .blink {
      animation: blink-anim 0.8s infinite;
    }
    @keyframes blink-anim {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    .pulse {
      animation: pulse-anim 3s infinite ease-in-out;
    }
    @keyframes pulse-anim {
      0%, 100% { opacity: 0.2; }
      50% { opacity: 0.5; }
    }
  </style>

  <!-- 1. Background Fill and Glows -->
  <rect width="800" height="280" fill="url(#bgGrad)" />
  <rect width="800" height="280" fill="url(#cyanGlow)" />
  <rect width="800" height="280" fill="url(#greenGlow)" />

  <!-- 2. Grid Pattern Overlay -->
  <rect width="800" height="280" fill="url(#grid)" />

  <!-- 3. Tech Design Elements / Corner Brackets -->
  <rect x="15" y="15" width="770" height="250" fill="none" stroke="#1e293b" stroke-width="1.5" />
  
  <path d="M 25 15 L 15 15 L 15 25" fill="none" stroke="#06b6d4" stroke-width="3" stroke-linecap="round" />
  <path d="M 775 15 L 785 15 L 785 25" fill="none" stroke="#06b6d4" stroke-width="3" stroke-linecap="round" />
  <path d="M 25 265 L 15 265 L 15 255" fill="none" stroke="#06b6d4" stroke-width="3" stroke-linecap="round" />
  <path d="M 775 265 L 785 265 L 785 255" fill="none" stroke="#06b6d4" stroke-width="3" stroke-linecap="round" />

  <!-- Technical HUD Graphics on the Right Side (Balances the left-aligned text) -->
  <g transform="translate(560, 40)" stroke="#334155" stroke-width="1" stroke-opacity="0.5" fill="none" class="pulse">
    <!-- Concentric circles -->
    <circle cx="100" cy="100" r="75" stroke="#06b6d4" stroke-opacity="0.1" stroke-width="1.5" />
    <circle cx="100" cy="100" r="50" stroke="#10b981" stroke-opacity="0.15" stroke-dasharray="6 6" />
    <circle cx="100" cy="100" r="10" stroke="#06b6d4" stroke-opacity="0.3" />
    <circle cx="100" cy="100" r="3" fill="#10b981" stroke="none" />
    
    <!-- Crosshair Ticks -->
    <line x1="100" y1="10" x2="100" y2="30" stroke="#06b6d4" stroke-opacity="0.3" />
    <line x1="100" y1="170" x2="100" y2="190" stroke="#06b6d4" stroke-opacity="0.3" />
    <line x1="10" y1="100" x2="30" y2="100" stroke="#06b6d4" stroke-opacity="0.3" />
    <line x1="170" y1="100" x2="190" y2="100" stroke="#06b6d4" stroke-opacity="0.3" />
  </g>

  <!-- Status Tags and System Indicators -->
  <g font-size="9" font-weight="bold" fill="#475569" class="font-tech">
    <!-- Top Left -->
    <text x="30" y="32">SYS.INIT // USER_AUTH_PASS</text>
    <rect x="180" y="24" width="6" height="6" fill="#10b981" class="blink" />
    
    <!-- Top Right -->
    <text x="770" y="32" text-anchor="end">SECURE_RLS_ACTIVE</text>
  </g>

  <!-- 4. Text Display Console (Left Aligned, No Boxes) -->
  <g class="font-tech">
    <!-- Prompt character indicator -->
    <text x="32" y="116" font-size="34" font-weight="bold" fill="#06b6d4">&gt;</text>

    <!-- Typing Name using Clip Path Mask -->
    <!-- Fuad Hiybo Hussin (starts at x="60") -->
    <text x="60" y="118" class="title-name" clip-path="url(#typingNameClip)">Fuad Hiybo Hussin</text>

    <!-- Typing Cursor (animates x step-by-step from 60 to 485, then blinks in place) -->
    <rect y="78" width="10" height="45" fill="#06b6d4">
      <animate 
        attributeName="x" 
        values="60;85;110;135;160;185;210;235;260;285;310;335;360;385;410;435;460;485" 
        dur="2.5s" 
        begin="0.5s" 
        fill="freeze" 
        calcMode="discrete"
      />
      <animate 
        attributeName="opacity" 
        values="1;0;1" 
        dur="0.8s" 
        repeatCount="indefinite" 
      />
    </rect>
  </g>

  <!-- Subtitle Roles Section (Left Aligned, Sans-Serif Font, reveal animation with blinking cursor) -->
  <g class="font-sans role-label">
    <text x="32" y="185" fill="#475569">&gt;_</text>

    <!-- Role 1 -->
    <text class="role-text role1" x="60" y="185" clip-path="url(#clipRole1)">
      Full-Stack Software Developer <tspan class="blink" font-weight="bold">|</tspan>
    </text>
    
    <!-- Role 2 -->
    <text class="role-text role2" x="60" y="185" clip-path="url(#clipRole2)">
      Next.js &amp; React Architect <tspan class="blink" font-weight="bold">|</tspan>
    </text>
    
    <!-- Role 3 -->
    <text class="role-text role3" x="60" y="185" clip-path="url(#clipRole3)">
      Node.js &amp; PostgreSQL Engineer <tspan class="blink" font-weight="bold">|</tspan>
    </text>
    
    <!-- Role 4 -->
    <text class="role-text role4" x="60" y="185" clip-path="url(#clipRole4)">
      Supabase &amp; RLS Security Expert <tspan class="blink" font-weight="bold">|</tspan>
    </text>
  </g>

  <!-- Console accent line ticks -->
  <path d="M 60 215 L 200 215" fill="none" stroke="#1e293b" stroke-width="1" />
  <circle cx="200" cy="215" r="2" fill="#10b981" />
</svg>
