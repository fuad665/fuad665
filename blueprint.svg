<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="100%" height="380">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="50%" stop-color="#090d1a" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Box Gradients -->
    <linearGradient id="boxGradCyan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#082f49" />
    </linearGradient>
    
    <linearGradient id="boxGradGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>

    <linearGradient id="boxGradPurple" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#3b0764" />
    </linearGradient>

    <!-- Connector Line Gradients -->
    <linearGradient id="cyanToGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <linearGradient id="greenToPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Glowing Effects -->
    <filter id="glowCyan" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowGreen" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-opacity="0.3" stroke-width="0.8" />
    </pattern>
  </defs>

  <style>
    .font-sans { font-family: system-ui, -apple-system, sans-serif; }
    .font-tech { font-family: 'Consolas', 'Fira Code', 'Courier New', monospace; }
    
    .section-title { font-size: 16px; font-weight: 700; fill: #ffffff; letter-spacing: 0.5px; }
    .item-text { font-size: 12px; fill: #94a3b8; }
    .item-highlight { font-size: 12px; font-weight: 600; fill: #e2e8f0; }
    .label-badge { font-size: 10px; font-weight: bold; fill: #ffffff; }
    
    .pulse-dot {
      animation: pulse-green 2.5s infinite;
    }
    @keyframes pulse-green {
      0%, 100% { fill: #10b981; fill-opacity: 0.8; r: 3px; }
      50% { fill: #34d399; fill-opacity: 0.2; r: 6px; }
    }
  </style>

  <!-- Background -->
  <rect width="800" height="380" fill="url(#bgGrad)" />
  <rect width="800" height="380" fill="url(#grid)" />

  <!-- Outer Border & Tech corner accents -->
  <rect x="15" y="15" width="770" height="350" fill="none" stroke="#1e293b" stroke-width="1.5" />
  <path d="M 25 15 L 15 15 L 15 25" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round" />
  <path d="M 775 15 L 785 15 L 785 25" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round" />
  <path d="M 25 365 L 15 365 L 15 355" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round" />
  <path d="M 775 365 L 785 365 L 785 355" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round" />

  <!-- Title Indicator -->
  <g class="font-tech" font-size="10" font-weight="bold" fill="#64748b">
    <text x="30" y="34">ARCHITECTURE_SCHEMATIC_v1.0</text>
    <rect x="235" y="26" width="6" height="6" fill="#06b6d4" />
  </g>

  <!-- Connectors / Flow Lines (Background lines) -->
  <g fill="none" stroke-linecap="round">
    <!-- Frontend to Gateway -->
    <path d="M 240 160 H 280" stroke="url(#cyanToGreen)" stroke-width="2" />
    <polygon points="280,156 288,160 280,164" fill="#10b981" />

    <!-- Gateway to Backend/DB -->
    <path d="M 520 160 H 560" stroke="url(#greenToPurple)" stroke-width="2" />
    <polygon points="560,156 568,160 560,164" fill="#a855f7" />

    <!-- Database back-loop (Feedback loop) -->
    <path d="M 680 230 V 270 H 120 V 230" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="4 4" />
    <polygon points="116,230 120,222 124,230" fill="#1e293b" />
  </g>

  <!-- ==================== COLUMN 1: CLIENT LAYER ==================== -->
  <g transform="translate(40, 55)">
    <!-- Box background -->
    <rect width="200" height="175" rx="8" fill="url(#boxGradCyan)" stroke="#06b6d4" stroke-opacity="0.5" stroke-width="1.5" />
    <rect width="200" height="175" rx="8" fill="none" stroke="#06b6d4" stroke-opacity="0.1" stroke-width="3" filter="url(#glowCyan)" />
    
    <!-- Title -->
    <text x="15" y="30" class="font-tech section-title">01 / CLIENT LAYER</text>
    <line x1="15" y1="40" x2="185" y2="40" stroke="#06b6d4" stroke-opacity="0.3" stroke-width="1" />

    <!-- Technologies -->
    <g transform="translate(15, 60)" class="font-sans">
      <!-- Item 1 -->
      <circle cx="5" cy="5" r="3" fill="#06b6d4" />
      <text x="15" y="9" class="item-highlight">Next.js 16 (App Router)</text>
      <text x="15" y="24" class="item-text">SSR &amp; Client Components</text>

      <!-- Item 2 -->
      <circle cx="5" cy="45" r="3" fill="#06b6d4" />
      <text x="15" y="49" class="item-highlight">Tailwind CSS v4</text>
      <text x="15" y="64" class="item-text">Fluid UI &amp; Styling System</text>

      <!-- Item 3 -->
      <circle cx="5" cy="85" r="3" fill="#06b6d4" />
      <text x="15" y="89" class="item-highlight">State &amp; API Client</text>
      <text x="15" y="104" class="item-text">Axios Interceptors &amp; Auth</text>
    </g>

    <!-- Badge -->
    <rect x="140" y="12" width="45" height="16" rx="3" fill="#0369a1" />
    <text x="162" y="24" class="font-tech label-badge" text-anchor="middle">FRONT</text>
  </g>

  <!-- ==================== COLUMN 2: SECURITY & MID ==================== -->
  <g transform="translate(300, 55)">
    <!-- Box background -->
    <rect width="220" height="175" rx="8" fill="url(#boxGradGreen)" stroke="#10b981" stroke-opacity="0.5" stroke-width="1.5" />
    <rect width="220" height="175" rx="8" fill="none" stroke="#10b981" stroke-opacity="0.1" stroke-width="3" filter="url(#glowGreen)" />
    
    <!-- Title -->
    <text x="15" y="30" class="font-tech section-title">02 / GATEWAY &amp; AUTH</text>
    <line x1="15" y1="40" x2="205" y2="40" stroke="#10b981" stroke-opacity="0.3" stroke-width="1" />

    <!-- Technologies -->
    <g transform="translate(15, 60)" class="font-sans">
      <!-- Item 1 -->
      <circle cx="5" cy="5" r="3" fill="#10b981" />
      <text x="15" y="9" class="item-highlight">Supabase Authentication</text>
      <text x="15" y="24" class="item-text">Secure JWT Session Flow</text>

      <!-- Item 2 -->
      <circle cx="5" cy="45" r="3" fill="#10b981" />
      <text x="15" y="49" class="item-highlight">Row-Level Security (RLS)</text>
      <text x="15" y="64" class="item-text">Tenant Isolation Policies</text>

      <!-- Item 3 -->
      <circle cx="5" cy="85" r="3" fill="#10b981" />
      <text x="15" y="89" class="item-highlight">Middleware Security</text>
      <text x="15" y="104" class="item-text">Route Guards &amp; CORS Check</text>
    </g>

    <!-- Pulse indicator for RLS (highlights security) -->
    <circle cx="190" cy="114" r="5" class="pulse-dot" />
    
    <!-- Badge -->
    <rect x="160" y="12" width="45" height="16" rx="3" fill="#047857" />
    <text x="182" y="24" class="font-tech label-badge" text-anchor="middle">SECURE</text>
  </g>

  <!-- ==================== COLUMN 3: BACKEND & DATABASE ==================== -->
  <g transform="translate(560, 55)">
    <!-- Box background -->
    <rect width="200" height="175" rx="8" fill="url(#boxGradPurple)" stroke="#a855f7" stroke-opacity="0.5" stroke-width="1.5" />
    <rect width="200" height="175" rx="8" fill="none" stroke="#a855f7" stroke-opacity="0.1" stroke-width="3" />
    
    <!-- Title -->
    <text x="15" y="30" class="font-tech section-title">03 / BACKEND &amp; DB</text>
    <line x1="15" y1="40" x2="185" y2="40" stroke="#a855f7" stroke-opacity="0.3" stroke-width="1" />

    <!-- Technologies -->
    <g transform="translate(15, 60)" class="font-sans">
      <!-- Item 1 -->
      <circle cx="5" cy="5" r="3" fill="#a855f7" />
      <text x="15" y="9" class="item-highlight">Node.js API Services</text>
      <text x="15" y="24" class="item-text">Express REST &amp; Server Logic</text>

      <!-- Item 2 -->
      <circle cx="5" cy="45" r="3" fill="#a855f7" />
      <text x="15" y="49" class="item-highlight">PostgreSQL Database</text>
      <text x="15" y="64" class="item-text">Optimized Table Schemas</text>

      <!-- Item 3 -->
      <circle cx="5" cy="85" r="3" fill="#a855f7" />
      <text x="15" y="89" class="item-highlight">Triggers &amp; SQL Views</text>
      <text x="15" y="104" class="item-text">Automated DB Operations</text>
    </g>

    <!-- Badge -->
    <rect x="140" y="12" width="45" height="16" rx="3" fill="#701a75" />
    <text x="162" y="24" class="font-tech label-badge" text-anchor="middle">DATA</text>
  </g>

  <!-- ==================== BOTTOM BLOCK: PIPELINE & CI/CD ==================== -->
  <g transform="translate(40, 260)">
    <!-- Box background -->
    <rect width="720" height="75" rx="8" fill="#0f172a" fill-opacity="0.9" stroke="#334155" stroke-width="1.5" />
    
    <!-- Title -->
    <text x="20" y="25" class="font-tech section-title" font-size="13">04 / CI-CD DEPLOYMENT PIPELINE</text>
    <line x1="20" y1="32" x2="700" y2="32" stroke="#334155" stroke-opacity="0.4" stroke-width="1" />

    <!-- Pipeline steps -->
    <g transform="translate(20, 52)" class="font-sans" font-size="11">
      <!-- Step 1 -->
      <text x="0" y="0" class="item-highlight">1. Version Control (Git)</text>
      
      <!-- Arrow -->
      <text x="165" y="0" fill="#64748b" font-weight="bold">➔</text>
      
      <!-- Step 2 -->
      <text x="195" y="0" class="item-highlight">2. Automated Actions (Lints &amp; Tests)</text>
      
      <!-- Arrow -->
      <text x="445" y="0" fill="#64748b" font-weight="bold">➔</text>
      
      <!-- Step 3 -->
      <text x="475" y="0" class="item-highlight">3. Cloud Edge Delivery (Vercel CDN)</text>
    </g>

    <!-- Pulse indicator for Pipeline status -->
    <circle cx="700" cy="50" r="4" fill="#10b981" class="pulse-dot" />
    
    <!-- Badge -->
    <rect x="655" y="10" width="45" height="16" rx="3" fill="#475569" />
    <text x="677" y="22" class="font-tech label-badge" text-anchor="middle">FLOW</text>
  </g>

  <!-- Bottom Accent Line -->
  <rect y="378" width="800" height="2" fill="url(#cyanToGreen)" />
</svg>
